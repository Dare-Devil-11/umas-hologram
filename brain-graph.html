<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#F5F0E8;--bg-alt:#FAFAF7;--surface:#FFFFFF;
  --text:#1A1109;--text-2:#5C4F3A;--text-3:#9C8E7A;
  --accent:#CC4E00;--accent-2:#E8510F;
  --border:rgba(26,17,9,0.10);--border-2:rgba(26,17,9,0.06);
  --radius:8px;--shadow:0 1px 4px rgba(26,17,9,0.10);
  --canvas-bg:#0D0907;
  --font:'Inter',-apple-system,sans-serif;--mono:'JetBrains Mono',monospace;
}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font);}
#layout{display:flex;width:100%;height:100vh;}

/* ── Sidebar ── */
#sidebar{
  width:300px;flex-shrink:0;
  background:var(--bg);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
  opacity:0;transform:translateX(-20px);
}
#sidebar-header{padding:20px 20px 16px;border-bottom:1px solid var(--border);}
#sidebar-logo{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;}
#sidebar-sub{font-size:11px;color:var(--text-3);font-family:var(--mono);}
#search-wrap{padding:12px 16px;border-bottom:1px solid var(--border);}
#search{
  width:100%;padding:8px 12px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);font-family:var(--font);font-size:13px;
  color:var(--text);outline:none;transition:border-color .2s;
}
#search:focus{border-color:var(--accent);}
#search::placeholder{color:var(--text-3);}
#stats{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;gap:16px;}
.stat{text-align:center;flex:1;}
.stat-val{font-size:16px;font-weight:600;color:var(--accent);font-family:var(--mono);}
.stat-lbl{font-size:9px;color:var(--text-3);letter-spacing:1px;text-transform:uppercase;margin-top:1px;}
#filters{padding:12px 16px;border-bottom:1px solid var(--border);}
.filter-label{font-size:9px;color:var(--text-3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;}
.ft-btns{display:flex;flex-wrap:wrap;gap:5px;}
.ft-btn{
  padding:4px 10px;border-radius:20px;font-size:11px;font-family:var(--font);
  border:1px solid var(--border);background:var(--surface);
  cursor:pointer;transition:all .18s;color:var(--text-2);
}
.ft-btn:hover,.ft-btn.active{color:#fff;border-color:transparent;}
.ft-btn[data-ft="code"].active{background:#CC4E00;}
.ft-btn[data-ft="document"].active{background:#7B5C2E;}
.ft-btn[data-ft="concept"].active{background:#3E6B52;}
.ft-btn[data-ft="image"].active{background:#3D5A80;}
.ft-btn[data-ft="rationale"].active{background:#7B3D6B;}
.ft-btn[data-ft="all"].active{background:var(--text);}
#node-list{flex:1;overflow-y:auto;padding:8px 0;}
#node-list::-webkit-scrollbar{width:3px;}
#node-list::-webkit-scrollbar-thumb{background:var(--border);}
.node-item{
  padding:8px 16px;cursor:pointer;transition:background .15s;
  border-left:2px solid transparent;
}
.node-item:hover{background:rgba(204,78,0,.06);border-left-color:var(--accent);}
.node-item.selected{background:rgba(204,78,0,.1);border-left-color:var(--accent);}
.ni-label{font-size:12px;color:var(--text);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ni-meta{font-size:10px;color:var(--text-3);margin-top:2px;}

/* ── Canvas area ── */
#canvas-wrap{flex:1;position:relative;background:var(--canvas-bg);overflow:hidden;}
canvas{position:absolute;top:0;left:0;}
#bg-canvas{z-index:0;}
#graph-canvas{z-index:1;cursor:grab;}
#graph-canvas:active{cursor:grabbing;}

/* ── Tooltip ── */
#tooltip{
  position:absolute;z-index:100;pointer-events:none;
  background:rgba(245,240,232,0.96);border:1px solid var(--border);
  border-radius:var(--radius);padding:10px 14px;
  box-shadow:var(--shadow);max-width:240px;
  opacity:0;transform:translateY(6px);transition:none;
}
#tt-label{font-size:13px;font-weight:600;color:var(--text);font-family:var(--mono);word-break:break-all;}
#tt-meta{font-size:11px;color:var(--text-2);margin-top:4px;}
#tt-deg{font-size:10px;color:var(--text-3);margin-top:2px;}

/* ── Controls ── */
#controls{
  position:absolute;bottom:20px;right:20px;z-index:50;
  display:flex;flex-direction:column;gap:6px;
  opacity:0;
}
.ctrl-btn{
  width:36px;height:36px;border-radius:var(--radius);
  background:rgba(245,240,232,0.9);border:1px solid var(--border);
  font-size:16px;cursor:pointer;transition:all .18s;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-2);box-shadow:var(--shadow);backdrop-filter:blur(8px);
}
.ctrl-btn:hover{background:var(--surface);color:var(--accent);}

/* ── Legend ── */
#legend{
  position:absolute;top:16px;right:16px;z-index:50;
  background:rgba(245,240,232,0.92);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 14px;
  box-shadow:var(--shadow);backdrop-filter:blur(8px);
  opacity:0;
}
#legend-title{font-size:9px;letter-spacing:1.5px;color:var(--text-3);text-transform:uppercase;margin-bottom:8px;}
.leg-row{display:flex;align-items:center;gap:7px;margin-bottom:5px;font-size:11px;color:var(--text-2);}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

/* ── Focus pill ── */
#focus-pill{
  position:absolute;top:16px;left:16px;z-index:50;
  background:rgba(204,78,0,.12);border:1px solid rgba(204,78,0,.3);
  border-radius:20px;padding:5px 14px;font-size:12px;color:var(--accent);
  font-family:var(--mono);display:none;cursor:pointer;transition:all .2s;
}
#focus-pill:hover{background:rgba(204,78,0,.2);}

/* Reduced motion */
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;}
}
</style>
</head>

    <div id="legend">

      <div class="leg-row"><div class="leg-dot" style="background:#CC4E00"></div>Code</div>

      <div class="leg-row"><div class="leg-dot" style="background:#8B4D7E"></div>Rationale</div>
    </div>
    <div id="focus-pill" id="focus-pill">✕ Clear focus</div>
  </div>
</div>

// ── Canvas setup ───────────────────────────────────────────────────────
const wrap = document.getElementById('canvas-wrap');
const bgCanvas = document.getElementById('bg-canvas');
const gc = document.getElementById('graph-canvas');
const bgCtx = bgCanvas.getContext('2d');
const ctx = gc.getContext('2d');
let W, H;

function resize() {
  W = wrap.clientWidth; H = wrap.clientHeight;
  bgCanvas.width = gc.width = W;
  bgCanvas.height = gc.height = H;
}
resize();
window.addEventListener('resize', () => { resize(); drawBg(); });

// ── Background bokeh effect ────────────────────────────────────────────
const bokeh = Array.from({length:60}, (_,i) => ({
  x: Math.random(), y: Math.random(),
  r: 1 + Math.random()*3,
  a: 0.03 + Math.random()*0.08,
  vx: (Math.random()-.5)*0.00015,
  vy: (Math.random()-.5)*0.00015,
  hue: [204,160,62,61,139][i%5]
}));

function drawBg() {
  bgCtx.fillStyle = '#0D0907';
  bgCtx.fillRect(0,0,W,H);
  // subtle grid
  bgCtx.strokeStyle = 'rgba(245,240,232,0.03)';
  bgCtx.lineWidth = 1;
  const g = 60;
  for(let x=0;x<W;x+=g){bgCtx.beginPath();bgCtx.moveTo(x,0);bgCtx.lineTo(x,H);bgCtx.stroke();}
  for(let y=0;y<H;y+=g){bgCtx.beginPath();bgCtx.moveTo(0,y);bgCtx.lineTo(W,y);bgCtx.stroke();}
  // bokeh dots
  bokeh.forEach(b => {
    const grd = bgCtx.createRadialGradient(b.x*W,b.y*H,0,b.x*W,b.y*H,b.r*8);
    grd.addColorStop(0,`hsla(${b.hue},60%,55%,${b.a})`);
    grd.addColorStop(1,'transparent');
    bgCtx.beginPath();
    bgCtx.arc(b.x*W,b.y*H,b.r*8,0,Math.PI*2);
    bgCtx.fillStyle=grd; bgCtx.fill();
    b.x += b.vx; b.y += b.vy;
    if(b.x<0||b.x>1) b.vx*=-1;
    if(b.y<0||b.y>1) b.vy*=-1;
  });
}

// ── D3 force simulation ────────────────────────────────────────────────
function nodeRadius(d) { return Math.max(3, Math.min(14, 3 + Math.sqrt(d.deg) * 1.2)); }

const sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(edges).id(d=>d.id).distance(d => 35).strength(0.4))
  .force('charge', d3.forceManyBody().strength(d => -Math.max(40, d.deg*2)).distanceMax(200))
  .force('center', d3.forceCenter(0, 0).strength(0.05))
  .force('collision', d3.forceCollide().radius(d => nodeRadius(d)+2))
  .force('x', d3.forceX(0).strength(0.02))
  .force('y', d3.forceY(0).strength(0.02))
  .alphaDecay(0.015)
  .on('end', () => { simRunning = false; });

// ── Draw loop ──────────────────────────────────────────────────────────
function getNodeColor(d) {
  if(selectedId && !connectedSet.has(d.id)) return 'rgba(180,160,140,0.2)';
  return FT_COLORS[d.ft] || FT_COLORS.other;
}
function getNodeAlpha(d) {
  if(activeFilter !== 'all' && d.ft !== activeFilter) return 0.12;
  if(searchQ && !d.l.toLowerCase().includes(searchQ)) return 0.08;
  return 1;
}

function draw() {
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(transform.x, transform.y);
  ctx.scale(transform.k, transform.k);

  // edges
  edges.forEach(e => {
    const s = e.source, t = e.target;
    if(!s.x||!t.x) return;
    const highlight = selectedId && (s.id===selectedId||t.id===selectedId);
    const dimmed = selectedId && !highlight;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(t.x, t.y);
    ctx.strokeStyle = highlight
      ? 'rgba(204,78,0,0.7)'
      : dimmed
        ? 'rgba(180,160,140,0.04)'
        : 'rgba(245,240,232,0.07)';
    ctx.lineWidth = highlight ? 1.5/transform.k : 0.6/transform.k;
    ctx.stroke();
  });

  // nodes
  nodes.forEach(d => {
    if(!d.x) return;
    const r = nodeRadius(d);
    const alpha = getNodeAlpha(d);
    const color = getNodeColor(d);
    const isSelected = d.id === selectedId;
    ctx.globalAlpha = alpha;

    // glow for hubs or selected
    if(isSelected || d.deg > 15) {
      const glowR = isSelected ? r*4 : r*2.5;
      const grd = ctx.createRadialGradient(d.x,d.y,0,d.x,d.y,glowR);
      grd.addColorStop(0, isSelected ? 'rgba(204,78,0,0.4)' : (FT_GLOW[d.ft]||FT_GLOW.other));
      grd.addColorStop(1,'transparent');
      ctx.beginPath(); ctx.arc(d.x,d.y,glowR,0,Math.PI*2);
      ctx.fillStyle=grd; ctx.fill();
    }

    // node circle
    ctx.beginPath(); ctx.arc(d.x,d.y,r,0,Math.PI*2);
    ctx.fillStyle = color; ctx.fill();
    if(isSelected) {
      ctx.strokeStyle='#F5F0E8'; ctx.lineWidth=2/transform.k; ctx.stroke();
    }

    // label for hubs (deg>20) or when zoomed in
    if((d.deg > 20 || transform.k > 2.5) && alpha > 0.5) {
      ctx.fillStyle='rgba(245,240,232,0.9)';
      ctx.font=`${Math.min(10/transform.k, 11)}px JetBrains Mono, monospace`;
      ctx.fillText(d.l.length>20?d.l.slice(0,18)+'…':d.l, d.x+r+3, d.y+4);
    }
    ctx.globalAlpha=1;
  });

  ctx.restore();
}

let bgTick = 0;
function loop() {
  requestAnimationFrame(loop);
  bgTick++;
  if(bgTick%3===0) drawBg();
  draw();
}
loop();

// ── Zoom / pan ─────────────────────────────────────────────────────────
const zoom = d3.zoom()
  .scaleExtent([0.1, 10])
  .on('zoom', e => { transform = e.transform; });

d3.select(gc).call(zoom);

function zoomTo(k, animate) {
  const t = d3.zoomIdentity.translate(W/2, H/2).scale(k);
  d3.select(gc).call(zoom.transform, t);
}
zoomTo(0.5);

document.getElementById('btn-zoom-in').onclick = () => d3.select(gc).call(zoom.scaleBy, 1.4);
document.getElementById('btn-zoom-out').onclick = () => d3.select(gc).call(zoom.scaleBy, 0.71);
document.getElementById('btn-reset').onclick = () => { selectedId=null; connectedSet.clear(); zoomTo(0.5); updateFocusPill(); };

// ── Tooltip & hit detection ────────────────────────────────────────────
const tt = document.getElementById('tooltip');
const ttLabel = document.getElementById('tt-label');
const ttMeta  = document.getElementById('tt-meta');
const ttDeg   = document.getElementById('tt-deg');

function findNode(mx, my) {
  const [wx,wy] = [transform.invertX(mx), transform.invertY(my)];
  let closest = null, bestD = Infinity;
  nodes.forEach(d => {
    if(!d.x) return;
    const dist = Math.hypot(d.x-wx, d.y-wy);
    const r = nodeRadius(d)/transform.k;
    if(dist < r+8/transform.k && dist < bestD) { closest=d; bestD=dist; }
  });
  return closest;
}

gc.addEventListener('mousemove', e => {
  const rect = gc.getBoundingClientRect();
  const mx = e.clientX-rect.left, my = e.clientY-rect.top;
  const node = findNode(mx, my);
  if(node) {
    gc.style.cursor = 'pointer';
    ttLabel.textContent = node.l;
    ttMeta.textContent = `${node.ft} · cluster ${node.cm}`;
    ttDeg.textContent = `${node.deg} connection${node.deg!==1?'s':''}`;
    let tx = e.clientX-rect.left+16, ty = e.clientY-rect.top-50;
    if(tx+260>W) tx -= 280; if(ty<0) ty=10;
    tt.style.left=tx+'px'; tt.style.top=ty+'px';
    tt.style.opacity='1'; tt.style.transform='translateY(0)';
  } else {
    gc.style.cursor = simRunning ? 'wait' : 'grab';
    tt.style.opacity='0';
  }
});
gc.addEventListener('mouseleave', () => { tt.style.opacity='0'; });

gc.addEventListener('click', e => {
  const rect = gc.getBoundingClientRect();
  const node = findNode(e.clientX-rect.left, e.clientY-rect.top);
  if(node) {
    selectNode(node);
  } else {
    selectedId=null; connectedSet.clear(); updateFocusPill(); updateNodeList();
  }
});

function selectNode(node) {
  selectedId = node.id;
  connectedSet = new Set([node.id]);
  edges.forEach(e => {
    const sid = e.source.id||e.source, tid = e.target.id||e.target;
    if(sid===node.id) connectedSet.add(tid);
    if(tid===node.id) connectedSet.add(sid);
  });
  updateFocusPill(node);
  updateNodeList();
  // pan to node
  const tx = W/2 - transform.k*node.x;
  const ty = H/2 - transform.k*node.y;
  d3.select(gc).call(zoom.transform, transform.translate((tx-transform.x)/transform.k, (ty-transform.y)/transform.k));
}

// ── Focus pill ────────────────────────────────────────────────────────
const pill = document.getElementById('focus-pill');
function updateFocusPill(node) {
  if(node) {
    pill.textContent = '✕  '+node.l;
    pill.style.display='block';
  } else {
    pill.style.display='none';
  }
}
pill.onclick = () => { selectedId=null; connectedSet.clear(); updateFocusPill(); updateNodeList(); };

// ── Sidebar node list ─────────────────────────────────────────────────
const nodeListEl = document.getElementById('node-list');
function updateNodeList() {
  const q = searchQ.toLowerCase();
  let visible = nodes.filter(n => {
    if(activeFilter!=='all' && n.ft!==activeFilter) return false;
    if(q && !n.l.toLowerCase().includes(q)) return false;
    return true;
  });
  // sort: selected first, then by degree
  visible.sort((a,b) => {
    if(a.id===selectedId) return -1;
    if(b.id===selectedId) return 1;
    return b.deg - a.deg;
  });
  visible = visible.slice(0,120);
  nodeListEl.innerHTML = '';
  visible.forEach(n => {
    const div = document.createElement('div');
    div.className = 'node-item' + (n.id===selectedId?' selected':'');
    div.innerHTML = '<div class="ni-label">'+escHtml(n.l)+'</div><div class="ni-meta">'+n.ft+' · '+n.deg+' links</div>';
    div.addEventListener('click', () => selectNode(n));
    nodeListEl.appendChild(div);
  });
}
function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    document.querySelectorAll('.ft-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.ft;
    updateNodeList();
  });
});

// ── Initial render ────────────────────────────────────────────────────
updateNodeList();
drawBg();

// ── Anime.js entrance animations ──────────────────────────────────────
anime({targets:'#sidebar',opacity:[0,1],translateX:[-20,0],duration:600,easing:'easeOutQuart',delay:200});
anime({targets:'#controls',opacity:[0,1],translateY:[12,0],duration:500,easing:'easeOutQuart',delay:500});
anime({targets:'#legend',opacity:[0,1],translateY:[-8,0],duration:500,easing:'easeOutQuart',delay:650});
anime({targets:'.stat-val',innerHTML:[0,null],round:1,duration:1200,easing:'easeOutExpo',delay:anime.stagger(100,{start:400})});
</script>
</body>
